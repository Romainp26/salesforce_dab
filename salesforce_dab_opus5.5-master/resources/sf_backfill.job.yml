# On-demand field backfill: fill newly approved or auto-added fields on the current SCD2 versions, from a
# `SELECT Id, <fields>` extract with no watermark. Closed versions keep null and watermarks don't move.
# Avoid the nightly window: both jobs MERGE into the same tables, and a conflict fails one of them.
resources:
  jobs:
    sf_backfill_roojai:
      name: sf-backfill-roojai_th_${bundle.target}
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.alert_email}
      # Operators run and repair the job; it runs as the service principal (runbook §6, B-29).
      permissions:
        - group_name: sf_operators_roojai_th_${bundle.target}
          level: CAN_MANAGE_RUN
      parameters:
        - name: fields
          # Comma-separated Object.Field entries, e.g. "Opportunity.Eligible_For_Monthly_Product__c".
          default: ""
      job_clusters:
        - job_cluster_key: sf
          new_cluster: ${var.sf_cluster}
      tasks:
        # Describes the objects and applies approvals, so the backfill knows tonight's fields and types.
        - task_key: preflight
          timeout_seconds: 3600
          job_cluster_key: sf
          python_wheel_task:
            package_name: sf_ingest
            entry_point: sf_ingest
            parameters: [preflight, --entity, roojai, --env, "${bundle.target}", --run-id, "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: backfill
          depends_on:
            - task_key: preflight
          timeout_seconds: ${var.long_task_timeout_seconds}
          job_cluster_key: sf
          python_wheel_task:
            package_name: sf_ingest
            entry_point: sf_ingest
            parameters: [backfill, --entity, roojai, --env, "${bundle.target}", --run-id, "{{job.run_id}}",
                         "--fields={{job.parameters.fields}}"]
          libraries:
            - whl: ../dist/*.whl

        # A backfilled column changes the view definition.
        - task_key: views
          depends_on:
            - task_key: backfill
          run_if: ALL_DONE
          timeout_seconds: 3600
          job_cluster_key: sf
          python_wheel_task:
            package_name: sf_ingest
            entry_point: sf_ingest
            parameters: [views, --entity, roojai, --env, "${bundle.target}", --run-id, "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl

        # Landing files can hold plaintext PII: always delete them.
        - task_key: cleanup
          depends_on:
            - task_key: preflight
            - task_key: backfill
            - task_key: views
          run_if: ALL_DONE
          timeout_seconds: 3600
          job_cluster_key: sf
          python_wheel_task:
            package_name: sf_ingest
            entry_point: sf_ingest
            parameters: [cleanup, --entity, roojai, --env, "${bundle.target}", --run-id, "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl
