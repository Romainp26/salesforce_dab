# Object configuration for roojai. Generated on 2026-10-26 by scripts/generate_config.py
# from objects_allowlist_and_watermarks.csv and encrypted_fields.txt; edit by pull request from now on.
# Keys: see ObjectConfig in src/sf_ingest/config.py. Objects list only what differs from defaults.
# *History objects also encrypt OldValue/NewValue for every PII field of their parent object (B-21).
defaults:
  api: bulk
  watermark: SystemModstamp
  load_type: incremental
  delete_policy: retain
  include_created_today: false
  new_fields: auto-add
  hash_exclude: [SystemModstamp, LastViewedDate, LastReferencedDate]
objects:
- name: Account
  new_fields: require-approval
  # Mobile_Formula__pc and Phone_Formula__pc: formula copies of the person-account phones (B-31).
  encrypted_fields: [Active_Phone_No__c, Active_Email__c, ACCOUNT_NAME__c, PP_no_as_unique__c, House_Number_Building_Number__c,
    Thai_Identification_Number__c, Contact_Individual_Passport_Number__c, Mobile_Formula__pc, Phone_Formula__pc]
  # Person-account names only; business accounts stay readable (design: PII encryption).
  conditional_encryption:
    columns: [Name, FirstName, LastName]
    when: "Id <> '0012r00000Y6z0IAAR' AND (Type IS NULL OR lower(Type) IN ('customer', 'prospect'))"
- {name: Account_Claim__History, watermark: CreatedDate}
- {name: AccountFeed}
- name: AccountHistory
  watermark: CreatedDate
  # Four of these fields are excluded from Account itself, so the history holds their only copy. Account's own PII
  # fields are added to this list automatically, as for every *History object of a PII object (B-21).
  history_encryption:
    fields: [PersonEmail, Phone, Thai_Identification_Number__c, Contact_Email_Address__c, PersonMobilePhone]
- {name: Asset}
- {name: AssetHistory, watermark: CreatedDate}
- name: AWSConnectOutboundCallList__c
  new_fields: require-approval
  encrypted_fields: [PhoneNumber__c]
