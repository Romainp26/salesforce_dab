# 8002r000000vRMSAA2 is a corrupted Contract record: any query that returns it fails Salesforce-side, so it is
# filtered in SOQL, never extracted. (The source CSV lists this condition under Contact; Id prefix 800 is Contract.)
# Paused in UAT, as in salesforce_dab: the UAT org's Bulk query failed with "INVALID_DATE_FORMAT: Invalid DateTime",
# possibly this same record. docs/uat-checklist.md tests whether the filter is enough to unpause it.
- name: Contract
  soql_filter: Id != '8002r000000vRMSAA2'
  paused: [uat]
