# Entities, orgs and secrets. Values marked TODO must be filled in before the first deploy.
# The catalog is derived as <entity>_<country>_<env> (D-10), e.g. roojai_th_prod.

# Salesforce REST/Bulk API version used for every call.
api_version: "67.0"

# Records per Bulk API 2.0 result page; each page becomes one landing file.
bulk_page_size: 100000

# Start of the CreatedDate ranges used to split an on-demand full reload of
# objects with `split_full_reload: true` (one range per year, run in parallel).
full_reload_split_from: "2012-01-01"

# Hours without a successful ingest after which an object raises the `object_freshness` warning (B-23).
freshness_hours: 36

# Hard-delete check of incremental objects (B-25): every `every_days` days an Id-only queryAll extract is compared
# with the current SCD2 records; missing ones get a hard-deleted version, hidden in the views. A check that would flag
# more than `max_deleted_share` of the current records fails the object instead. every_days: 0 turns it off.
reconcile:
  every_days: 7
  max_deleted_share: 0.05

# Unity Catalog groups that preflight grants to (B-29); {catalog} becomes e.g. roojai_th_prod.
access:
  readers: sf_readers_{catalog}                  # SELECT on the bronze_salesforce views
  history_readers: sf_history_readers_{catalog}  # SELECT on bronze_salesforce_scd2 (every version, ciphertext)
  operators: sf_operators_{catalog}              # SELECT on ops_salesforce; runs the jobs
  pii_readers: pii_readers_{catalog}             # EXECUTE on ops_salesforce.decrypt_pii and decrypt_pii_at

# PII encryption (D-07, B-13). Each entity reads its key from its own scope (B-22); whether Roojai and Kumka hold the
# same key value there (cross-entity joins on ciphertext) or different ones (isolation) is open question Q11.
# Stored value: base64 (no line breaks) of Spark's aes_encrypt CBC output, which starts with the 16-byte IV.
# The key is 32 random bytes and the IV 16 random bytes, both stored base64 in the entity's PII secret scope:
#   python -c "import os, base64; print(base64.b64encode(os.urandom(32)).decode())"   # key
#   python -c "import os, base64; print(base64.b64encode(os.urandom(16)).decode())"   # IV
pii:
  key_version: 1
  key_encoding: base64  # base64 | hex | utf8
  iv_encoding: base64  # base64 | hex | utf8
  iv_prefixed: true
  # Spark's base64() can put CRLF every 76 characters (spark.sql.chunkBase64String.enabled); pinned off.
  base64_line_breaks: false
  aes_key_secret: sf-pii-aes-key
  aes_iv_secret: sf-pii-aes-iv
  # Keys replaced by a rotation, in the same scope, read only by the rotate task (runbook §5.12, B-27):
  #   - {key_version: 1, aes_key_secret: sf-pii-aes-key, aes_iv_secret: sf-pii-aes-iv}
  previous_keys: []
  # The key that encrypted the backup_salesforce data (Synapse, salesforce_dab): the seed decrypts with it and
  # re-encrypts with the key above. Remove once every environment is seeded.
  legacy:
    secret_scope: TH-BI-databricks-kv  # TODO confirm; defaults to the entity's PII scope when omitted
    key_encoding: utf8
    iv_encoding: hex
    aes_key_secret: sf-encryption-key
    aes_iv_secret: sf-encryption-iv

# One secret scope (Key Vault backed) per environment for the Salesforce JWT secrets: READ for the service principal
# only, never for a user or group (B-22). The PII keys live in each entity's pii_secret_scopes.
environments:
  uat:
    secret_scope: sf-ingest-uat  # TODO
  prod:
    secret_scope: sf-ingest-prod  # TODO

entities:
  roojai:
    country: th
    # D-23: records deleted by these users are archived, not soft-deleted.
    archival_user_ids: ["0052r0000018PjjAAE", "00528000001b87GAAQ"]
    # AES key and IV (pii.aes_key_secret, pii.aes_iv_secret): READ for the service principal and
    # pii_readers_<catalog> only (B-22).
    pii_secret_scopes:
      uat: sf-pii-roojai-uat  # TODO
      prod: sf-pii-roojai-prod  # TODO
    secrets:
      consumer_key: roojai-sf-consumer-key
      # PEM private key (optionally followed by its certificate) or a base64 PFX.
      private_key: roojai-sf-jwt-key
      # Only needed for a password-protected PFX; remove otherwise.
      private_key_password: roojai-sf-jwt-key-password
    orgs:
      # domain: "login", "test", or the My Domain prefix such as "roojai.my" / "roojai--uat.sandbox.my".
      uat:
        domain: test  # TODO
        username: TODO-integration-user@roojai.com.uat
      prod:
        domain: login  # TODO
        username: TODO-integration-user@roojai.com

  # Phase 2 (D-22): fill in once Kumka's object and field lists exist.
  kumka:
    country: th
    archival_user_ids: []  # TODO
    pii_secret_scopes:
      uat: sf-pii-kumka-uat  # TODO
      prod: sf-pii-kumka-prod  # TODO
    secrets:
      consumer_key: kumka-sf-consumer-key
      private_key: kumka-sf-jwt-key
      private_key_password: kumka-sf-jwt-key-password
    orgs:
      uat:
        domain: test  # TODO
        username: TODO-integration-user@kumka.com.uat
      prod:
        domain: login  # TODO
        username: TODO-integration-user@kumka.com
